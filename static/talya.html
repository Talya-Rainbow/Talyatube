<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Talya-Tube</title>
<style>
:root{
  --bg:#0c0a12;--card:#1a1528;--line:#3b3355;--text:#f5f0ff;--muted:#b0a4c9;
  --accent:#a78bfa;--accent2:#f0abfc;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
body.rtl{direction:rtl}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
video,img{max-width:100%;display:block}

/* Gates */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(165deg,#1a1030 0%,#0c0a12 50%,#2a1540 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate.hidden{display:none}
.gate h1{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(105deg,#f0abfc,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gate p{color:var(--muted);margin-bottom:20px;max-width:320px}
.lang-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.lang-btn{padding:16px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:600}
.lang-btn:active{transform:scale(.98)}
.lang-btn.he{font-size:22px}
.msg-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;max-width:340px;margin-bottom:18px}
.msg-box p{color:var(--text);font-size:16px;line-height:1.5;margin:0}
.ok-btn{width:100%;max-width:280px;padding:16px;border-radius:16px;background:linear-gradient(105deg,#f0abfc,#a78bfa);color:#1a1020;font-weight:700;font-size:17px}

/* App shell */
#app{display:none;flex-direction:column;height:100%;height:100dvh}
#app.show{display:flex}
.top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-weight:800;font-size:18px;background:linear-gradient(105deg,#f0abfc,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-spacer{flex:1}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.content{flex:1;overflow:auto;padding:12px;padding-bottom:calc(72px + var(--safe-b));-webkit-overflow-scrolling:touch}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(56px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:40}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none}
.nav a.on{color:#f0abfc}
.nav .ico{font-size:18px}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:480px){.grid{grid-template-columns:1fr 1fr}}
.card{cursor:pointer;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.thumb{aspect-ratio:16/9;background:#120e1c;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 12px}
.v-title{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-sub{font-size:12px;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:6px;font-size:16px}

.view{display:none}.view.on{display:block}
.player-box{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;margin:0 -12px;width:calc(100% + 24px);max-height:50vh}
.player-box video{width:100%;height:100%;object-fit:contain}
.ptitle{font-size:17px;font-weight:700;margin:12px 0 6px}
.meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.pill.pri{background:linear-gradient(105deg,#f0abfc,#a78bfa);color:#1a1020;border:0}
.pill.danger{color:#fca5a5}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px calc(20px + var(--safe-b));max-height:85vh;overflow:auto}
.modal h2{font-size:18px;margin-bottom:8px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.modal input{width:100%;height:44px;padding:0 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:#fff;font-size:16px;outline:none}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:#fca5a5;font-size:13px;margin-top:8px;min-height:1.2em}
.toast{position:fixed;bottom:calc(70px + var(--safe-b));left:50%;transform:translateX(-50%);background:#f5f0ff;color:#1a1020;padding:12px 18px;border-radius:12px;z-index:110;display:none;font-weight:600;max-width:90%;text-align:center}
.upload-zone{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);margin:8px 0}
.upload-zone input{display:none}

.comments{margin-top:16px;background:var(--card);border-radius:12px;padding:12px}
.comment{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>
<!-- Language gate -->
<div class="gate" id="langGate">
  <h1>Talya-Tube</h1>
  <p>Choose language · בחרו שפה</p>
  <div class="lang-btns">
    <button type="button" class="lang-btn" id="pickEn">English</button>
    <button type="button" class="lang-btn he" id="pickHe">עברית</button>
  </div>
</div>

<!-- Bat mitzvah message gate -->
<div class="gate hidden" id="msgGate">
  <div class="msg-box"><p id="batMsg"></p></div>
  <button type="button" class="ok-btn" id="okBtn">Okay</button>
</div>

<!-- App -->
<div id="app">
  <header class="top">
    <div class="brand">Talya-Tube</div>
    <div class="top-spacer"></div>
    <button class="icon" id="uploadBtn" style="display:none" title="Upload">＋</button>
    <button class="icon" id="authBtn" data-t="signIn">Sign in</button>
  </header>
  <main class="content" id="content">
    <section class="view on" id="homeView">
      <div class="grid" id="videoGrid"></div>
      <div class="empty" id="emptyHome"><strong data-t="noVideos">No videos yet</strong><p data-t="noVideosHint">Sign up and upload. Everyone sees the same videos.</p></div>
    </section>
    <section class="view" id="playerView">
      <div class="player-box"><video id="player" controls playsinline></video></div>
      <h1 class="ptitle" id="playingTitle"></h1>
      <div class="meta" id="playingMeta"></div>
      <div class="row">
        <button class="pill" id="likeBtn" data-t="like">Like</button>
        <button class="pill danger" id="deleteBtn" style="display:none" data-t="delete">Delete</button>
        <button class="pill" id="backHome" data-t="back">Back</button>
      </div>
      <div class="comments">
        <strong data-t="comments">Comments</strong>
        <div id="commentList" style="margin-top:10px"></div>
        <div id="commentForm" style="display:none;margin-top:10px">
          <input id="commentInput" data-t-placeholder="addComment" placeholder="Add a comment…">
          <button class="pill pri" id="commentSend" style="margin-top:8px" data-t="comment">Comment</button>
        </div>
        <p id="commentHint" style="color:var(--muted);font-size:13px;margin-top:8px" data-t="signInComment">Sign in to comment.</p>
      </div>
    </section>
    <section class="view" id="libraryView">
      <h2 style="margin-bottom:12px" data-t="yourVideos">Your videos</h2>
      <div class="grid" id="libraryGrid"></div>
      <div class="empty" id="libraryEmpty"><strong data-t="nothingYet">Nothing yet</strong></div>
    </section>
  </main>
  <nav class="nav">
    <a href="#" data-page="home" class="on"><span class="ico">⌂</span><span data-t="home">Home</span></a>
    <a href="#" data-page="library"><span class="ico">▣</span><span data-t="you">You</span></a>
  </nav>
</div>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2 data-t="yourName">Your name</h2>
    <p style="color:var(--muted);font-size:13px" data-t="nameHint">Just your name — this device will remember you.</p>
    <label data-t="displayName">Display name</label>
    <input id="authName" autocomplete="nickname" placeholder="Talya">
    <div class="err" id="authErr"></div>
    <div class="modal-actions">
      <button class="pill" id="authCancel" data-t="cancel">Cancel</button>
      <button class="pill pri" id="authSubmit" data-t="continue">Continue</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="uploadModal">
  <div class="modal">
    <h2 data-t="upload">Upload</h2>
    <div class="upload-zone" id="uploadZone">
      <strong data-t="chooseVideo">Choose a video</strong>
      <input type="file" id="videoFile" accept="video/*">
    </div>
    <div id="uploadName" style="font-size:13px;color:#f0abfc;margin-top:6px"></div>
    <label data-t="title">Title</label>
    <input id="uploadTitle">
    <div class="err" id="uploadErr"></div>
    <div class="modal-actions">
      <button class="pill" id="uploadCancel" data-t="cancel">Cancel</button>
      <button class="pill pri" id="uploadSubmit" data-t="upload">Upload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOKEN_KEY = 'anitube_token'; // same backend accounts
  const LANG_KEY = 'talya_lang';
  let token = localStorage.getItem(TOKEN_KEY) || '';
  let me = null;
  let videos = [];
  let current = null;
  let lang = localStorage.getItem(LANG_KEY) || '';
  let authMode = 'login';
  let pendingFile = null;

  const T = {
    en: {
      batMsg: "This is for Talya's bat mitzvah — afterwards use it for whatever you like!",
      ok: 'Okay',
      home: 'Home', you: 'You', signIn: 'Your name', signUp: 'Your name',
      yourName: 'Your name', nameHint: 'Just your name — this device will remember you.',
      displayName: 'Display name',
      continue: 'Continue', cancel: 'Cancel',
      noVideos: 'No videos yet', noVideosHint: 'Sign up and upload. Everyone sees the same videos.',
      like: 'Like', delete: 'Delete', back: 'Back',
      comments: 'Comments', addComment: 'Add a comment…', comment: 'Comment',
      signInComment: 'Sign in to comment.',
      yourVideos: 'Your videos', nothingYet: 'Nothing yet',
      upload: 'Upload', chooseVideo: 'Choose a video', title: 'Title',
      signedOut: 'Signed out', uploaded: 'Uploaded', deleted: 'Deleted',
      loginRequired: 'Sign in first',
      wrongUser: 'Username taken — Sign in instead, or pick a different name',
    },
    he: {
      batMsg: 'זה לבת המצווה של טליה — אחר כך אפשר להשתמש בזה לכל מה שתרצו!',
      ok: 'בסדר',
      home: 'בית', you: 'שלי', signIn: 'השם שלך', signUp: 'השם שלך',
      yourName: 'השם שלך', nameHint: 'רק השם — המכשיר הזה יזכור אתכם.',
      displayName: 'שם לתצוגה',
      continue: 'המשך', cancel: 'ביטול',
      noVideos: 'אין עדיין סרטונים', noVideosHint: 'הירשמו והעלו. כולם רואים את אותם סרטונים.',
      like: 'לייק', delete: 'מחיקה', back: 'חזרה',
      comments: 'תגובות', addComment: 'הוסיפו תגובה…', comment: 'שלחו',
      signInComment: 'התחברו כדי להגיב.',
      yourVideos: 'הסרטונים שלי', nothingYet: 'עדיין אין',
      upload: 'העלאה', chooseVideo: 'בחרו סרטון', title: 'כותרת',
      signedOut: 'התנתקתם', uploaded: 'הועלה', deleted: 'נמחק',
      loginRequired: 'קודם התחברו',
      wrongUser: 'שם המשתמש תפוס — התחברו או בחרו שם אחר',
    }
  };

  function t(key) {
    return (T[lang] && T[lang][key]) || T.en[key] || key;
  }

  function applyI18n() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'en';
    document.body.classList.toggle('rtl', lang === 'he');
    document.querySelectorAll('[data-t]').forEach(el => {
      const k = el.getAttribute('data-t');
      if (T[lang] && T[lang][k] != null) el.textContent = T[lang][k];
    });
    document.querySelectorAll('[data-t-placeholder]').forEach(el => {
      const k = el.getAttribute('data-t-placeholder');
      if (T[lang] && T[lang][k] != null) el.placeholder = T[lang][k];
    });
    $('okBtn').textContent = t('ok');
    $('batMsg').textContent = t('batMsg');
    updateAuthBtn();
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(toast._tm);
    toast._tm = setTimeout(() => el.style.display = 'none', 2500);
  }

  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (opts.body && !(opts.body instanceof FormData) && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }
    const r = await fetch(path, { credentials: 'include', ...opts, headers });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
    return data;
  }

  function setToken(tok) {
    token = tok || '';
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function timeAgo(ts) {
    const s = Math.floor(Date.now() / 1000 - (ts || 0));
    if (s < 60) return lang === 'he' ? 'עכשיו' : 'just now';
    if (s < 3600) return Math.floor(s / 60) + (lang === 'he' ? ' דק׳' : ' min');
    if (s < 86400) return Math.floor(s / 3600) + (lang === 'he' ? ' שע׳' : ' h');
    return Math.floor(s / 86400) + (lang === 'he' ? ' ימ׳' : ' d');
  }

  function thumbHTML(v) {
    if (v.thumbnail) return `<img loading="lazy" src="${esc(v.thumbnail)}" alt="">`;
    return `<video muted preload="metadata" src="${esc(v.url)}#t=0.5"></video>`;
  }

  function card(v) {
    return `<article class="card" data-id="${esc(v.id)}">
      <div class="thumb">${thumbHTML(v)}</div>
      <div class="card-body">
        <div class="v-title">${esc(v.title)}</div>
        <div class="v-sub">${esc(v.channel || '')} · ${timeAgo(v.created_at)}</div>
      </div>
    </article>`;
  }

  function renderGrid(id, list, emptyId) {
    const g = $(id), em = $(emptyId);
    if (!g) return;
    g.innerHTML = list.map(card).join('');
    if (em) em.style.display = list.length ? 'none' : 'block';
    g.querySelectorAll('[data-id]').forEach(el => {
      el.onclick = () => play(el.dataset.id);
    });
  }

  function show(page) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    const el = $(page + 'View');
    if (el) el.classList.add('on');
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.page === page));
    $('content').scrollTop = 0;
    if (page === 'home') renderGrid('videoGrid', videos.filter(v => !v.is_short), 'emptyHome');
    if (page === 'library') {
      const mine = me ? videos.filter(v => v.user_id === me.id) : [];
      renderGrid('libraryGrid', mine, 'libraryEmpty');
    }
  }

  function updateAuthBtn() {
    const btn = $('authBtn');
    if (me) {
      btn.textContent = me.display_name || me.username;
      $('uploadBtn').style.display = '';
    } else {
      btn.textContent = t('signIn');
      $('uploadBtn').style.display = 'none';
    }
  }

  async function loadMe() {
    try {
      const data = await api('/api/me');
      me = data.user;
    } catch (e) { me = null; setToken(''); }
    updateAuthBtn();
  }

  async function loadVideos() {
    const data = await api('/api/videos');
    videos = data.videos || [];
    show(document.querySelector('.view.on')?.id?.replace('View','') || 'home');
  }

  async function play(id) {
    const v = videos.find(x => x.id === id);
    if (!v) return;
    current = v;
    $('player').src = v.url;
    $('player').play().catch(() => {});
    $('playingTitle').textContent = v.title;
    $('playingMeta').textContent = (v.channel || '') + ' · ' + (v.likes || 0) + ' · ' + timeAgo(v.created_at);
    $('deleteBtn').style.display = (me && String(me.id) === String(v.user_id)) ? '' : 'none';
    $('commentForm').style.display = me ? '' : 'none';
    $('commentHint').style.display = me ? 'none' : '';
    renderComments(v.comments || []);
    show('player');
    if (me) {
      try { await api('/api/history', { method: 'POST', body: JSON.stringify({ video_id: v.id }) }); } catch (e) {}
    }
  }

  function renderComments(list) {
    const comments = list || [];
    $('commentList').innerHTML = comments.length
      ? comments.slice().reverse().map(c => `
        <div class="comment">
          <div><strong>${esc(c.username)}</strong>
          <span style="color:var(--muted);font-size:12px"> · ${timeAgo(c.created_at)}</span>
          <div>${esc(c.text)}</div></div>
        </div>`).join('')
      : `<p style="color:var(--muted);font-size:13px">${lang === 'he' ? 'אין תגובות עדיין' : 'No comments yet'}</p>`;
  }

  // Language + intro gates
  function openApp() {
    $('langGate').classList.add('hidden');
    $('msgGate').classList.add('hidden');
    $('app').classList.add('show');
    applyI18n();
    loadMe().then(loadVideos);
    setInterval(loadVideos, 20000);
  }

  function afterLang(code) {
    lang = code;
    localStorage.setItem(LANG_KEY, lang);
    applyI18n();
    $('langGate').classList.add('hidden');
    $('msgGate').classList.remove('hidden');
  }

  $('pickEn').onclick = () => afterLang('en');
  $('pickHe').onclick = () => afterLang('he');
  $('okBtn').onclick = () => openApp();

  // Always show language first each visit (user asked when website is opened)
  // If you want remember lang only, could skip lang gate — user said asked when opened
  $('langGate').classList.remove('hidden');
  $('msgGate').classList.add('hidden');
  $('app').classList.remove('show');

  function getDeviceId() {
    let id = localStorage.getItem('talya_device_id');
    if (!id) {
      id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('talya_device_id', id);
    }
    return id;
  }

  // Auth — display name only, remembered by device
  $('authBtn').onclick = () => {
    if (me) {
      if (confirm(lang === 'he' ? 'להתנתק?' : 'Sign out?')) {
        api('/api/logout', { method: 'POST', body: '{}' }).catch(() => {});
        setToken('');
        me = null;
        updateAuthBtn();
        toast(t('signedOut'));
        show('home');
      }
      return;
    }
    $('authErr').textContent = '';
    $('authName').value = localStorage.getItem('talya_display_name') || '';
    $('authModal').classList.add('show');
  };
  $('authCancel').onclick = () => $('authModal').classList.remove('show');
  $('authSubmit').onclick = async () => {
    const display_name = $('authName').value.trim();
    $('authErr').textContent = '';
    if (!display_name) {
      $('authErr').textContent = t('nameHint');
      return;
    }
    try {
      const data = await api('/api/device-login', {
        method: 'POST',
        body: JSON.stringify({ device_id: getDeviceId(), display_name })
      });
      if (data.token) setToken(data.token);
      me = data.user;
      localStorage.setItem('talya_display_name', display_name);
      $('authModal').classList.remove('show');
      updateAuthBtn();
      await loadVideos();
    } catch (e) {
      $('authErr').textContent = e.message;
    }
  };

  $('uploadBtn').onclick = () => {
    if (!me) { toast(t('loginRequired')); return; }
    pendingFile = null;
    $('uploadName').textContent = '';
    $('videoFile').value = '';
    $('uploadErr').textContent = '';
    $('uploadModal').classList.add('show');
  };
  $('uploadCancel').onclick = () => $('uploadModal').classList.remove('show');
  $('uploadZone').onclick = () => $('videoFile').click();
  $('videoFile').onchange = e => {
    pendingFile = e.target.files[0];
    if (pendingFile) $('uploadName').textContent = pendingFile.name;
  };
  $('uploadSubmit').onclick = async () => {
    if (!pendingFile) { $('uploadErr').textContent = t('chooseVideo'); return; }
    const btn = $('uploadSubmit');
    btn.disabled = true;
    try {
      const fd = new FormData();
      fd.append('file', pendingFile);
      fd.append('title', $('uploadTitle').value);
      fd.append('category', 'All');
      await api('/api/videos', { method: 'POST', body: fd });
      $('uploadModal').classList.remove('show');
      toast(t('uploaded'));
      await loadVideos();
    } catch (e) {
      $('uploadErr').textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  };

  $('likeBtn').onclick = async () => {
    if (!current) return;
    if (!me) { toast(t('loginRequired')); return; }
    try {
      const data = await api('/api/videos/like', { method: 'POST', body: JSON.stringify({ id: current.id }) });
      current.likes = data.likes;
      $('playingMeta').textContent = (current.channel || '') + ' · ' + current.likes + ' · ' + timeAgo(current.created_at);
    } catch (e) { toast(e.message); }
  };
  $('deleteBtn').onclick = async () => {
    if (!current || !me) return;
    if (!confirm(lang === 'he' ? 'למחוק את הסרטון?' : 'Delete this video?')) return;
    try {
      await api('/api/videos/delete', { method: 'POST', body: JSON.stringify({ id: current.id }) });
      videos = videos.filter(v => v.id !== current.id);
      current = null;
      toast(t('deleted'));
      show('home');
    } catch (e) { toast(e.message); }
  };
  $('backHome').onclick = () => show('home');
  $('commentSend').onclick = async () => {
    if (!me || !current) return;
    const text = $('commentInput').value.trim();
    if (!text) return;
    try {
      const data = await api('/api/comments', {
        method: 'POST',
        body: JSON.stringify({ video_id: current.id, text })
      });
      current.comments = data.comments || [];
      $('commentInput').value = '';
      renderComments(current.comments);
    } catch (e) { toast(e.message); }
  };

  document.querySelectorAll('.nav a').forEach(a => {
    a.onclick = e => {
      if (!a.dataset.page) return; // allow Apps → /
      e.preventDefault();
      show(a.dataset.page);
    };
  });
})();
</script>
</body>
</html>
